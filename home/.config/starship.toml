
# ================================================================ #
# ============ GENERATED FROM TEMPLATE, DO NOT EDIT ============== #
# ================================================================ #
palette = "catppuccin_mocha"

format = """
$directory\
$git_branch\
${custom.worktree}\
$character
"""

# Disable the blank line at the start of the prompt
add_newline = false

[directory]
style = "bg:surface0 fg:subtext1"
format = "[](fg:surface0)[$path]($style)[](fg:surface0)"
truncation_length = 1
truncation_symbol = "… /"

[git_branch]
symbol = ""
style = "bg:surface0 fg:subtext1"
format = '[](fg:surface0)[$symbol $branch]($style)[](fg:surface0)'

# Shown only inside a linked git worktree (git-dir diverges from git-common-dir there)
[custom.worktree]
when = 'test "$(git rev-parse --git-dir 2>/dev/null)" != "$(git rev-parse --git-common-dir 2>/dev/null)"'
command = 'basename "$(git rev-parse --show-toplevel)"'
symbol = ""
style = "bg:surface0 fg:peach"
format = '[](fg:surface0)[$symbol $output]($style)[](fg:surface0)'

# Replace the '❯' symbol in the prompt with ''
[character] # The name of the module we are configuring is 'character'
success_symbol = '[](fg:#000000)'
error_symbol = '[](fg:red)'
vimcmd_symbol = '[](fg:text)'
vimcmd_replace_one_symbol = '[](fg:sky)'
vimcmd_replace_symbol = '[](fg:lavender)'
vimcmd_visual_symbol = '[](fg:peach)'

# Here is how you can shorten some long paths by surface2 replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = ""
"Pictures" = ""


